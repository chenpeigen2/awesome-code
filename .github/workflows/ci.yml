name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS / TS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [music-player, js/text-dance, js/openrouter-models]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      # 测试不需要 electron 二进制，省一次上百 MB 的下载
      - run: npm ci
        working-directory: ${{ matrix.project }}
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
        working-directory: ${{ matrix.project }}
      - run: npm run build
        working-directory: ${{ matrix.project }}
      - run: npm test
        working-directory: ${{ matrix.project }}
        if: matrix.project == 'music-player'

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: py-imageviewer 测试与静态检查
        working-directory: py-imageviewer
        run: |
          uv sync --all-extras
          uv run pytest -q
          uv run ruff check .
          uv run mypy src
      - name: python 工作区静态检查
        working-directory: python
        run: |
          uv sync --all-extras
          uv run ruff check .

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [flutter/flutter_getx_demo, flutter/flutter_widgets_gallery, flutter/flutter_rust_demo]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: ${{ matrix.project }}
      - run: flutter test
        working-directory: ${{ matrix.project }}
      # 只把 warning / error 当作失败，info 级别的风格建议不阻断
      - run: flutter analyze --no-fatal-infos
        working-directory: ${{ matrix.project }}

  java:
    name: Java / Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: ./gradlew --console=plain build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [rust-tauri-demo, flutter/flutter_rust_demo/rust, android/androidx/jni-demo/rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets
        working-directory: ${{ matrix.project }}
