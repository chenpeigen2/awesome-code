name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-npm:
    name: JS / TS (npm) - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      # 一个项目失败不要取消其它项目，方便定位
      fail-fast: false
      matrix:
        project: [music-player, js/text-dance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      # 测试不需要 electron 二进制，省一次上百 MB 的下载
      - run: npm ci
        working-directory: ${{ matrix.project }}
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
        working-directory: ${{ matrix.project }}
      - run: npm run build
        working-directory: ${{ matrix.project }}
      - run: npm test
        working-directory: ${{ matrix.project }}
        if: matrix.project == 'music-player'

  js-bun:
    name: JS / TS (bun) - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [js/openrouter-models, js/bun-demo]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: ${{ matrix.project }}
      - run: bun run lint
        working-directory: ${{ matrix.project }}
        if: matrix.project == 'js/openrouter-models'
      - run: bunx vite build
        working-directory: ${{ matrix.project }}
        if: matrix.project == 'js/openrouter-models'
      - run: bun test
        working-directory: ${{ matrix.project }}
        if: matrix.project == 'js/bun-demo'

  python:
    name: Python
    runs-on: ubuntu-latest
    env:
      # 无头环境下跑 PyQt 相关测试
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖（校验锁文件）
        working-directory: py-imageviewer
        run: uv sync --all-extras --locked
      - name: pytest
        working-directory: py-imageviewer
        run: uv run pytest -q
      - name: ruff
        working-directory: py-imageviewer
        run: uv run ruff check .
      - name: mypy
        working-directory: py-imageviewer
        run: uv run mypy src
      - name: 安装依赖（python 工作区）
        working-directory: python
        run: uv sync --all-extras --locked
      - name: ruff（python 工作区）
        working-directory: python
        run: uv run ruff check .

  flutter:
    name: Flutter - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [flutter/flutter_getx_demo, flutter/flutter_widgets_gallery, flutter/flutter_rust_demo]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: ${{ matrix.project }}
      - run: flutter test
        working-directory: ${{ matrix.project }}
      # 只把 warning / error 当作失败，info 级别的风格建议不阻断
      - run: flutter analyze --no-fatal-infos
        working-directory: ${{ matrix.project }}

  java:
    name: Java / Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: ./gradlew --console=plain build

  rust:
    name: Rust - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [rust-tauri-demo, flutter/flutter_rust_demo/rust, android/androidx/jni-demo/rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # tauri 在 Linux 上需要这些系统库
      - name: 安装 Tauri 依赖
        if: matrix.project == 'rust-tauri-demo'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file
      - run: cargo check --all-targets
        working-directory: ${{ matrix.project }}
