[project]
name = "awesome-python"
version = "0.1.0"
description = "Python 学习示例集合 - 包含基础语法、内置函数、面向对象、多线程、正则表达式、PyTorch 等示例"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "chenpeigen" }]
keywords = ["python", "learning", "examples", "pytorch", "tutorial"]
dependencies = [
    "pandas>=3.1.1",
    "numpy>=2.5.5",
    "matplotlib>=3.11.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "Pillow>=13.0.0",
    "typer>=0.29.2",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.17.5", "mypy>=2.4.1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
# 示例代码刻意保留了题解/其他语言的习惯命名，改名会破坏教学对照
ignore = [
    "E501",   # 行长不作为错误
    "N802",   # 函数名允许非 snake_case（LeetCode 题名等）
    "N816",   # 全局变量允许混合大小写（类型演示命名）
    "N803",   # 参数名允许非 snake_case
    "N806",   # 变量名允许非 snake_case
]

[tool.ruff.lint.per-file-ignores]
# 以下文件是官方文档示例的忠实复刻，保持原样写法以保留教学对照
"builtin_funcs/object_introspection.py" = ["E721", "E701"]
"builtin_funcs/code_execution.py" = ["F841"]  # x/y 供 eval() 使用
"builtin_funcs/basis.py" = ["N801", "UP031"]
"oop/__init__.py" = ["F841", "F821", "B018", "N815", "UP031"]
"lambdas/__init__.py" = ["E731"]  # 本节主题就是 lambda 赋值
"pytorch_tutorials/*.py" = ["N812", "E402"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.uv.workspace]
members = [
    "streamlit_demo",
]
