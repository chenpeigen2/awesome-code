[project]
name = "awesome-python"
version = "0.1.0"
description = "Python 学习示例集合 - 包含基础语法、内置函数、面向对象、多线程、正则表达式、PyTorch 等示例"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "chenpeigen" }]
keywords = ["python", "learning", "examples", "pytorch", "tutorial"]
dependencies = [
    "pandas>=3.1.1",
    "numpy>=2.5.5",
    "matplotlib>=3.11.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "Pillow>=13.0.0",
    "typer>=0.29.2",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.17.5", "mypy>=2.4.1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.uv.workspace]
members = [
    "streamlit_demo",
]
